<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Your Name is a frontend developer specializing in React, JavaScript, Tailwind CSS, and modern responsive web experiences."
    />

    <meta
      name="keywords"
      content="frontend developer, React developer, JavaScript developer, Tailwind CSS, web developer, UI developer, portfolio"
    />

    <meta name="author" content="James" />

    <meta name="robots" content="index, follow" />

    <meta name="theme-color" content="#07070b" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="James — Frontend Developer" />
    <meta
      property="og:description"
      content="Frontend developer creating fast, modern, and beautiful digital experiences."
    />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta property="og:site_name" content="James" />
    <meta
      property="og:image"
      content="https://yourdomain.com/og-image.jpg"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="James — Frontend Developer" />
    <meta
      name="twitter:description"
      content="Frontend developer creating modern digital experiences with React and Tailwind CSS."
    />
    <meta
      name="twitter:image"
      content="https://yourdomain.com/og-image.jpg"
    />

    <!-- Canonical -->
    <link rel="canonical" href="https://yourdomain.com/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>James — Frontend Developer</title>

    <!-- Person structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "James",
        "url": "https://yourdomain.com/",
        "jobTitle": "Frontend Developer",
        "description": "Frontend developer specializing in React, JavaScript, Tailwind CSS, and modern web experiences.",
        "sameAs": [
          "https://github.com/yourusername",
          "https://www.linkedin.com/in/yourusername"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
